name: Build and Push Docker images

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  # change these repository names if you want
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-frontend
  BACKEND_IMAGE:  ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (only needed for multi-arch; safe if kept)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx (for build cache and push)
        uses: docker/setup-buildx-action@v2

      - name: Cache node_modules or maven repo
        if: matrix.service == 'frontend'
        uses: actions/cache@v4
        with:
          path: |
            ecommerce-frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('ecommerce-frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache maven
        if: matrix.service == 'backend'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Build and push image (frontend)
        if: matrix.service == 'frontend'
        uses: docker/build-push-action@v4
        with:
          context: ./ecommerce-frontend
          file: ./ecommerce-frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:cache
          cache-to: type=inline

      - name: Build and push image (backend)
        if: matrix.service == 'backend'
        uses: docker/build-push-action@v4
        with:
          context: ./ecommerce-backend
          file: ./ecommerce-backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:cache
          cache-to: type=inline
